apiVersion: v1
kind: Secret
metadata:
  name: i27-helpdesk-notification-secret
  namespace: ${NAMESPACE}
stringData:
  SERVER_PORT: "8084"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "{{SMTP_USER}}"
  SMTP_PASSWORD: "{{SMTP_PASSWORD}}"
  DATABASE_URL: "{{DATABASE_URL}}"
  AUTH_SERVICE_URL: "http://i27-helpdesk-auth.${NAMESPACE}.svc.cluster.local"
  TICKET_SERVICE_URL: "http://i27-helpdesk-ticket.${NAMESPACE}.svc.cluster.local"
